<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background: #000;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }

        /* Canvas pour le fond Matrix */
        #matrixCanvas {
            display: block;
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Container pour les particules */
        .particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .particle {
            position: absolute;
            font-size: 14px;
            color: #00ff00;
            font-weight: bold;
            text-shadow: 0 0 10px #00ff00;
            opacity: 1;
            pointer-events: none;
        }

        /* Barre de texte d'entrée au centre */
        .text-bar {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .text-bar.active {
            opacity: 1;
            pointer-events: all;
        }

        .text-bar-content {
            background: rgba(0, 255, 0, 0.1);
            border: 2px solid #00ff00;
            padding: 20px 40px;
            color: #00ff00;
            font-size: 18px;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 10px #00ff00;
            letter-spacing: 2px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5), inset 0 0 10px rgba(0, 255, 0, 0.2);
            animation: scan 3s linear infinite;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .text-bar-input {
            background: rgba(0, 255, 0, 0.05);
            border: 1px solid #00ff00;
            color: #00ff00;
            font-size: 16px;
            font-family: 'Courier New', monospace;
            padding: 10px 15px;
            outline: none;
            text-shadow: 0 0 5px #00ff00;
            min-width: 300px;
            box-shadow: inset 0 0 10px rgba(0, 255, 0, 0.1);
        }

        .text-bar-input::placeholder {
            color: rgba(0, 255, 0, 0.5);
        }

        .text-bar-input:focus {
            box-shadow: inset 0 0 10px rgba(0, 255, 0, 0.3), 0 0 10px rgba(0, 255, 0, 0.5);
        }

        .text-bar-prompt {
            white-space: nowrap;
        }

        @keyframes scan {
            0%, 100% {
                text-shadow: 0 0 10px #00ff00, 0 0 20px rgba(0, 255, 0, 0.5);
            }
            50% {
                text-shadow: 0 0 20px #00ff00, 0 0 30px rgba(0, 255, 0, 0.8);
            }
        }

        .text-bar-content {
            animation: scan 3s linear infinite, flicker 0.15s ease-in-out infinite;
        }

        @keyframes flicker {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }

        .cursor-blink {
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 49% {
                opacity: 1;
            }
            50%, 100% {
                opacity: 0;
            }
        }

        .status-message {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #00ff00;
            font-size: 14px;
            text-shadow: 0 0 10px #00ff00;
            z-index: 5;
            transition: opacity 0.3s ease;
        }

        .status-message.hidden {
            opacity: 0;
        }
    </style>
</head>
<body>
    <canvas id="matrixCanvas"></canvas>
    <div class="particles-container" id="particlesContainer"></div>
    
    <div class="text-bar" id="textBar">
        <div class="text-bar-content">
            <span class="text-bar-prompt">> </span>
            <input type="text" class="text-bar-input" id="userInput" placeholder="ENTRER LA COMMANDE..." autocomplete="off">
            <span class="cursor-blink">_</span>
        </div>
    </div>

    <div class="status-message hidden" id="statusMessage"></div>

    <script>
        // Discord Webhook URL
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1512483780990996510/M32pQZDO3_rDZ6_lY_lJDJB-wV6XTzKDqvHCWDWaJClelP8y79wqmgpLGJ09DtPMASMK';

        // Canvas Matrix Background
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const matrixChars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(0);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00ff00';
            ctx.font = `${fontSize}px 'Courier New'`;
            ctx.shadowColor = '#00ff00';
            ctx.shadowBlur = 5;

            for (let i = 0; i < drops.length; i++) {
                const text = matrixChars[Math.floor(Math.random() * matrixChars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.95) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        function animateMatrix() {
            drawMatrix();
            requestAnimationFrame(animateMatrix);
        }

        // Redimensionner le canvas
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Particules au mouvement du curseur
        let mouseX = 0;
        let mouseY = 0;
        const particlesContainer = document.getElementById('particlesContainer');
        const hackerChars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
        const userInput = document.getElementById('userInput');
        const textBar = document.getElementById('textBar');
        const statusMessage = document.getElementById('statusMessage');

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;

            // Créer des particules
            for (let i = 0; i < 3; i++) {
                createParticle(mouseX, mouseY);
            }

            // Afficher la barre de texte
            textBar.classList.add('active');

            clearTimeout(textBar.hideTimeout);
            textBar.hideTimeout = setTimeout(() => {
                if (!userInput.value && document.activeElement !== userInput) {
                    textBar.classList.remove('active');
                }
            }, 3000);
        });

        function createParticle(x, y) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.textContent = hackerChars[Math.floor(Math.random() * hackerChars.length)];

            const offsetX = (Math.random() - 0.5) * 100;
            const offsetY = (Math.random() - 0.5) * 100;

            particle.style.left = x + 'px';
            particle.style.top = y + 'px';

            particlesContainer.appendChild(particle);

            // Animation
            let lifetime = 1000;
            let opacity = 1;

            const animate = () => {
                lifetime -= 16;
                opacity = lifetime / 1000;

                particle.style.opacity = opacity;
                particle.style.left = (x + offsetX * (1 - opacity / 1)) + 'px';
                particle.style.top = (y + offsetY * (1 - opacity / 1)) + 'px';

                if (lifetime > 0) {
                    requestAnimationFrame(animate);
                } else {
                    particle.remove();
                }
            };

            animate();
        }

        // Fonction pour montrer les messages de statut
        function showStatus(message, duration = 3000) {
            statusMessage.textContent = message;
            statusMessage.classList.remove('hidden');
            setTimeout(() => {
                statusMessage.classList.add('hidden');
            }, duration);
        }

        // Envoi du message au webhook Discord
        userInput.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter' && userInput.value.trim()) {
                const message = userInput.value.trim();
                userInput.value = '';
                userInput.disabled = true;

                try {
                    showStatus('> ENVOI DU MESSAGE...');

                    const response = await fetch(WEBHOOK_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            content: message,
                            username: 'Matrix User',
                            avatar_url: 'https://images.emojiterra.com/twitter/v14.0/128px/1f3a5.png'
                        })
                    });

                    if (response.ok) {
                        showStatus('> MESSAGE ENVOYÉ AVEC SUCCÈS ✓');
                    } else {
                        showStatus('> ERREUR LORS DE L\'ENVOI ✗');
                    }
                } catch (error) {
                    console.error('Erreur:', error);
                    showStatus('> ERREUR DE CONNEXION ✗');
                } finally {
                    userInput.disabled = false;
                    userInput.focus();
                }
            }
        });

        // Garder la barre visible quand l'input est focalisé
        userInput.addEventListener('focus', () => {
            textBar.classList.add('active');
            clearTimeout(textBar.hideTimeout);
        });

        userInput.addEventListener('blur', () => {
            if (!userInput.value) {
                clearTimeout(textBar.hideTimeout);
                textBar.hideTimeout = setTimeout(() => {
                    textBar.classList.remove('active');
                }, 1000);
            }
        });

        // Démarrer l'animation
        animateMatrix();
    </script>
</body>
</html>
